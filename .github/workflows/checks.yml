name: Checks and version PRs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  prepare-version:
    name: Prepare version PR (never publish)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: version-pr
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      # Explicit workflow_dispatch does, without a separate long-lived token.
      - name: Validate the version PR
        if: steps.version-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.version-pr.outputs.pr }}
        run: |
          branch="$(jq -er '.headBranchName' <<< "$PR_JSON")"
          gh workflow run checks.yml --ref "$branch"
